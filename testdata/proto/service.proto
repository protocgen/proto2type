syntax = "proto3";
package test.v1;

option go_package = "github.com/protocgen/proto2type/testdata/golden/go/pb;pb";

import "user.proto";

// GetUserRequest is the request for GetUser.
message GetUserRequest {
  string id = 1;
}

// GetUserResponse is the response for GetUser.
message GetUserResponse {
  User user = 1;
}

// ListUsersRequest is the request for ListUsers.
message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// ListUsersResponse is the response for ListUsers.
message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

// UpdateUserRequest is the request for UpdateUser.
message UpdateUserRequest {
  User user = 1;
  repeated string update_mask = 2;
}

// UserService provides CRUD operations on Users.
service UserService {
  // GetUser retrieves a user by ID.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // ListUsers retrieves a paginated list of users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // UpdateUser updates a user with field mask.
  rpc UpdateUser(UpdateUserRequest) returns (GetUserResponse);
}
