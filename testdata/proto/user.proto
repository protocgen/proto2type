syntax = "proto3";
package test.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/protocgen/proto2type/testdata/golden/go/pb";

// UserStatus represents the user's account status.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
  USER_STATUS_DELETED = 3;
}

// User represents a user account.
message User {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string email = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string.email = true
  ];
  string display_name = 3 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
  bool active = 4;
  int32 age = 5 [(buf.validate.field).int32 = {gte: 0, lte: 150}];
  repeated string roles = 6 [(buf.validate.field).repeated = {min_items: 1, max_items: 10}];
  map<string, string> metadata = 7;
  Address address = 8;
  google.protobuf.Timestamp created_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Duration session_timeout = 10;
  optional string phone = 11 [(buf.validate.field).string = {min_len: 7, max_len: 20, pattern: "^\\+?[0-9\\-\\s]+$"}];
  bytes avatar = 12;
  google.protobuf.StringValue nickname = 13;
  UserStatus status = 14;

  oneof contact_method {
    string contact_email = 15;
    string contact_phone = 16;
  }
  repeated Tag tags = 17;
  optional google.protobuf.Timestamp deleted_at = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional UserStatus previous_status = 19;

  // WKT reference types
  google.protobuf.FieldMask update_mask = 20;
  google.protobuf.Struct extra_metadata = 21;
  google.protobuf.ListValue preferences = 22;

  // Optional bytes
  optional bytes avatar_thumbnail = 23;

  // Repeated WKT reference types (Issue #52)
  repeated google.protobuf.FieldMask field_masks = 24;
  repeated google.protobuf.Struct structs = 25;
  repeated google.protobuf.ListValue lists = 26;

  // WKT map values (Issue #53)
  map<string, google.protobuf.Timestamp> event_times = 27;
  map<string, google.protobuf.Struct> configs = 28;

  // Value type coverage (Issue #116)
  google.protobuf.Value single_value = 29;
  repeated google.protobuf.Value values = 30;
  map<string, google.protobuf.Value> value_map = 31;

  // Wrapper map values (Issue #116)
  map<string, google.protobuf.StringValue> labels = 32;
  map<string, google.protobuf.Int64Value> scores = 33;

  string old_field = 34 [deprecated = true];
  string optional_name = 35;
  int64 big_number = 36;
}

// Address is a nested message.
message Address {
  string street = 1 [(buf.validate.field).string = {min_len: 1}];
  string city = 2 [(buf.validate.field).string = {min_len: 1}];
  string state = 3 [(buf.validate.field).string = {min_len: 2, max_len: 2}];
  string zip = 4 [(buf.validate.field).string = {pattern: "^[0-9]{5}(-[0-9]{4})?$"}];
  string country = 5;
}

// Tag is a label with a key-value pair.
message Tag {
  string key = 1;
  string value = 2;
}

// Category is a recursive tree structure for testing z.lazy() generation.
message Category {
  string name = 1;
  Category parent = 2;           // singular self-ref → z.lazy()
  repeated Category children = 3; // repeated self-ref → z.array(z.lazy())
}
