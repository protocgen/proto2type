syntax = "proto3";
package proto2type;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/protocgen/proto2type/proto/proto2type";

// Message-level options for proto2type.
// Extension number 1307 is permanently registered in the Protocol Buffers
// global registry (protocolbuffers/protobuf#28153).
extend google.protobuf.MessageOptions {
  MessageOptions message = 1307;
}

message MessageOptions {
  // Skip generating types for this message.
  bool skip = 1;

  // Apache Doris 4.x and Apache Iceberg lakehouse table metadata.
  TableOptions table = 2;
}

// TableOptions defines Apache Doris 4.x and Apache Iceberg lakehouse table
// metadata on a message. Wire-compatible with legacy table metadata extension 50201.
message TableOptions {
  string table_name = 1;
  string database_scope = 2;
  string sync_tier = 3;
  repeated string unique_key_columns = 4;
  repeated string partition_by_columns = 5;
  string colocate_group = 6;
  string sequence_col = 7;
  repeated string inverted_index_columns = 8;
  repeated string ngram_bf_columns = 9;
  repeated string bloom_filter_columns = 10;
  string distributed_by_column = 11;
  repeated string duplicate_key_columns = 12;
  int32 file_cache_ttl_seconds = 13;
  string storage_vault_name = 14;
  string iceberg_catalog = 15;
  int32 embedding_dimension = 16;

  // Owning microservice that writes to this table (e.g. "patient-service").
  // For PostgreSQL tables without an explicit table_name override, prefixes the
  // physical table name as "<normalized_writer_service>__<snake_case_msg>".
  string writer_service = 17;
  // Additional microservices permitted to read from this table (or "*" for shared read).
  repeated string reader_services = 18;

  // Explicit primary key column names for relational (PostgreSQL) tables.
  repeated string primary_key_fields = 19;
  // Explicit composite or named indexes for relational (PostgreSQL) tables.
  repeated IndexDef indexes = 20;
}

// IndexDef defines a single or composite relational index on a table.
message IndexDef {
  string name = 1;
  repeated string columns = 2;
  bool unique = 3;
}

// ForeignKey defines a relational foreign key reference on a column.
message ForeignKey {
  string ref_table = 1;
  string ref_column = 2;
  string on_delete = 3;
  string on_update = 4;
}

// Field-level options for proto2type.
extend google.protobuf.FieldOptions {
  FieldOptions field = 1307;
}

message FieldOptions {
  // Mark as document ID field.
  // Firestore: excluded from struct (ID is doc path).
  // Mongo: tagged bson:"_id".
  bool document_id = 1;

  // Server-managed timestamp (Firestore serverTimestamp).
  bool server_timestamp = 2;

  // Override the storage field name.
  string name = 3;

  // Exclude from generated types entirely.
  bool skip = 4;

  // Force omitempty behavior.
  OptionalBool omitempty = 5;

  // Flatten nested message fields into parent (Mongo: bson:",inline").
  bool inline = 6;

  // Store this enum field as its string name instead of int32.
  // Per-field override for the global enum_as_string plugin option.
  OptionalBool enum_as_string = 7;

  // Field-level encryption: encrypt before storage write, decrypt after read.
  // Only valid for string fields. Generates EncryptFields/DecryptFields methods.
  bool encrypt = 8;

  // Computed/derived field: auto-populated from a source field via a transform.
  // Excluded from domain types. Used for Firestore search indexes.
  ComputedField computed = 9;

  // Apache Doris 4.x and Apache Iceberg lakehouse column metadata.
  ColumnOptions column = 10;

  // Mark this field as a primary key column in relational (PostgreSQL) tables.
  bool primary_key = 11;

  // Create a non-unique B-tree index on this column in relational (PostgreSQL) tables.
  bool index = 12;

  // Create a unique index/constraint on this column in relational (PostgreSQL) tables.
  bool unique = 13;

  // Relational foreign key reference for this column.
  ForeignKey foreign_key = 14;
}

// ColumnOptions defines Apache Doris 4.x and Apache Iceberg lakehouse column
// metadata on a field. Wire-compatible with legacy column metadata extension 50200.
message ColumnOptions {
  string doris_type = 1;
  string iceberg_type = 2;
  bool inverted_index = 3;
  bool is_unique_key = 4;
  bool is_sequence_col = 5;
  bool inline_nested = 6;
  bool is_partition_key = 7;
  bool strip_enum_prefix = 8;
  string column_name = 9;
  string default_value = 10;

  // Explicit PostgreSQL SQL type override (e.g. "VARCHAR(64)", "NUMERIC(10,2)", "UUID").
  string sql_type = 11;
  // DEPRECATED/FORBIDDEN: JSONB column types are forbidden in relational PostgreSQL schemas.
  bool jsonb = 12 [deprecated = true];
  // Maximum character length for VARCHAR(N) in PostgreSQL.
  int32 length = 13;
  // Mark column as primary key in PostgreSQL.
  bool primary_key = 14;
  // Create a non-unique index on this column in PostgreSQL.
  bool index = 15;
  // Create a unique index on this column in PostgreSQL.
  bool unique = 16;
  // Override column nullability in PostgreSQL.
  OptionalBool nullable = 17;
  // Relational foreign key reference for this column in PostgreSQL.
  ForeignKey foreign_key = 18;
  // Alias for sql_type: explicit PostgreSQL SQL type override (e.g. "VARCHAR(64)", "NUMERIC(18, 4)").
  string postgres_type = 19;
}

// ComputedField defines a derived field that is automatically populated
// from another field during FromDomain() conversion.
message ComputedField {
  // Source field name (snake_case, must reference another field in the same message).
  string source = 1;
  // Transform to apply. Supported: "lower", "upper".
  string transform = 2;
}

enum OptionalBool {
  OPTIONAL_BOOL_UNSPECIFIED = 0;
  OPTIONAL_BOOL_TRUE = 1;
  OPTIONAL_BOOL_FALSE = 2;
}
