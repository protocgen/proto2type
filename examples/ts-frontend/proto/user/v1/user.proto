syntax = "proto3";
package user.v1;

option go_package = "github.com/protocgen/proto2type/examples/go-api-server/gen/user/v1;userv1";

import "buf/validate/validate.proto";

// UserRole defines the access level for a user.
enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_MEMBER = 1;
  USER_ROLE_ADMIN = 2;
}

// User represents a registered user.
message User {
  // Email must be a valid email address.
  string email = 1 [(buf.validate.field).string.email = true];

  // Display name: 1–100 characters.
  string display_name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 100
  }];

  // Age: 13–120.
  int32 age = 3 [(buf.validate.field).int32 = {gte: 13, lte: 120}];

  // Role must be a defined enum value.
  UserRole role = 4 [(buf.validate.field).enum.defined_only = true];

  // Bio is optional, max 500 chars when provided.
  optional string bio = 5 [(buf.validate.field).string.max_len = 500];
}
