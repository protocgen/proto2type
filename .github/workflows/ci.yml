name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o protoc-gen-proto2type .

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Allowlist: these stdlib CVEs have no available patch (fixed in Go 1.26.6+).
        # Remove IDs as Go releases patches. Unknown vulns still fail CI.
        run: |
          KNOWN_UNPATCHED="GO-2026-6218 GO-2026-6090 GO-2026-5972 GO-2026-5856 GO-2026-5026"
          OUTPUT=$(govulncheck ./... 2>&1) || true
          FOUND=$(echo "$OUTPUT" | grep -oP 'GO-\d{4}-\d+' | sort -u)
          UNEXPECTED=""
          for vuln in $FOUND; do
            if ! echo "$KNOWN_UNPATCHED" | grep -qw "$vuln"; then
              UNEXPECTED="$UNEXPECTED $vuln"
            fi
          done
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected vulnerabilities found:$UNEXPECTED"
            echo "$OUTPUT"
            exit 1
          fi
          echo "govulncheck: only known unpatched stdlib CVEs found (allowed)"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT=$(gofmt -l .)
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files are not formatted:"
            echo "$GOFMT_OUTPUT"
            exit 1
          fi

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Run actionlint
        run: actionlint

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -exclude-dir=testdata -exclude-dir=proto ./...

  golden-test:
    name: Golden File Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          github_token: ${{ github.token }}

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Build plugin
        run: go build -o protoc-gen-proto2type .

      - name: Add plugin to PATH
        run: echo "$PWD" >> "$GITHUB_PATH"

      - name: Regenerate golden files (all backends)
        run: |
          cd testdata/proto
          buf generate
          buf generate --template buf.gen.rust.yaml
          buf generate --template buf.gen.python.yaml
          buf generate --template buf.gen.kotlin.yaml

      - name: Check for golden file drift
        run: git diff --exit-code testdata/golden/


  rust-compile-check:
    name: Rust Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Create compile-check Cargo project
        run: |
          mkdir -p /tmp/rust-compile-check/src
          cat > /tmp/rust-compile-check/Cargo.toml <<'EOF'
          [package]
          name = "proto2type-compile-check"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          chrono = { version = "0.4.20", features = ["serde"] }
          rusqlite = { version = "0.35", features = ["bundled"] }
          validator = { version = "0.20", features = ["derive"] }
          lazy_static = "1"
          regex = "1"
          EOF
          sed -i 's/^          //' /tmp/rust-compile-check/Cargo.toml

          # For each proto (e.g. catalog, user), create a module directory:
          # src/catalog/mod.rs   (domain types)
          # src/catalog/sqlite.rs (storage types, uses super::*)
          echo '// Auto-generated compile check' > /tmp/rust-compile-check/src/lib.rs
          for domain_file in testdata/golden/rust/gen/*.type.rs; do
            base=$(basename "$domain_file" .type.rs)
            # Skip sqlite files (handled as submodules) and buffa files (skipped entirely;
            # they depend on crate::proto which isn't available in this scaffold)
            if echo "$base" | grep -qE '_sqlite$|_buffa'; then
              continue
            fi
            # Create module directory
            mkdir -p "/tmp/rust-compile-check/src/${base}"
            # Copy domain file as mod.rs
            cp "$domain_file" "/tmp/rust-compile-check/src/${base}/mod.rs"
            # Add the sqlite submodule declaration to mod.rs
            sqlite_file="testdata/golden/rust/gen/${base}_sqlite.type.rs"
            if [ -f "$sqlite_file" ]; then
              echo '' >> "/tmp/rust-compile-check/src/${base}/mod.rs"
              echo 'pub mod sqlite;' >> "/tmp/rust-compile-check/src/${base}/mod.rs"
              cp "$sqlite_file" "/tmp/rust-compile-check/src/${base}/sqlite.rs"
            fi
            # Note: buffa files are skipped because they depend on crate::proto
            # (ConnectRPC generated types) which aren't available in this scaffold.
            # Register in lib.rs
            echo "pub mod ${base};" >> /tmp/rust-compile-check/src/lib.rs
          done

      - name: Cargo check generated Rust code
        run: cargo check --manifest-path /tmp/rust-compile-check/Cargo.toml

      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit generated code dependencies
        run: cd /tmp/rust-compile-check && cargo audit

  kotlin-compile-check:
    name: Kotlin Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Compile Kotlin golden files
        run: cd tests/kotlin && ./gradlew compileKotlin --no-daemon -q

  integration-db:
    name: Integration Tests (DB)
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          github_token: ${{ github.token }}

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Start Firestore emulator
        run: |
          firebase emulators:start --only firestore --project demo-test &
          # Wait for emulator to be ready
          for _ in $(seq 1 30); do
            curl -s http://localhost:8080 > /dev/null && break
            sleep 1
          done
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Build plugin
        run: go build -o protoc-gen-proto2type .

      - name: Generate test types
        run: |
          cd testdata/proto
          PATH="$(git rev-parse --show-toplevel):$PATH" buf generate

      - name: Run integration tests
        run: go test -tags integration ./tests/integration/... -v -count=1
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          MONGO_URI: mongodb://localhost:27017

  rust-integration-test:
    name: Rust Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh and test
        run: |
          bash tests/rust-integration/refresh.sh
          cd tests/rust-integration && cargo test -- --nocapture

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: cd testdata/golden/ts && npm ci

      - name: tsc typecheck
        run: cd testdata/golden/ts && npx tsc --noEmit --project tsconfig.json

      - name: Zod runtime validation
        run: |
          cd testdata/golden/ts
          npx tsc
          node dist/test/validate_test.js

      - name: npm audit
        run: cd testdata/golden/ts && npm audit --omit=dev

      - name: Example typecheck
        run: cd examples/ts-frontend && npm ci && npx tsc --noEmit

  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Pydantic runtime validation
        run: uv run --with 'pydantic>=2' --python 3.11 tests/python/test_runtime.py

      - name: mypy type check
        run: |
          uv run --with 'pydantic>=2' --with mypy --python 3.11 \
            mypy testdata/golden/python/gen/ --ignore-missing-imports
